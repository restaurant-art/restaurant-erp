name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint==1.57.2
      - run: cfn-lint deploy/aws/cloudformation.yml
      - run: bash -n deploy/aws/run-migration.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vestano
          POSTGRES_USER: vestano
          POSTGRES_PASSWORD: vestano
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
        env:
          DEBUG: "True"
          SECRET_KEY: ci-secret
          DATABASE_URL: postgres://vestano:vestano@localhost:5432/vestano
          REDIS_URL: redis://localhost:6379/0
      - run: python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "True"
          SECRET_KEY: ci-secret
          DATABASE_URL: postgres://vestano:vestano@localhost:5432/vestano
          REDIS_URL: redis://localhost:6379/0
      - run: python manage.py test apps.core.tests
        env:
          DEBUG: "True"
          SECRET_KEY: ci-secret
          DATABASE_URL: postgres://vestano:vestano@localhost:5432/vestano
          REDIS_URL: redis://localhost:6379/0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
