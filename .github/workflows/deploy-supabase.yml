name: Deploy VESTORA Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure QZ Tray signing secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          QZ_CERTIFICATE: ${{ secrets.QZ_CERTIFICATE }}
          QZ_PRIVATE_KEY: ${{ secrets.QZ_PRIVATE_KEY }}
        run: |
          supabase secrets set \
            --project-ref vqinmequtjkuzrtzkzsk \
            QZ_CERTIFICATE="$QZ_CERTIFICATE" \
            QZ_PRIVATE_KEY="$QZ_PRIVATE_KEY"

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy vestora-api --project-ref vqinmequtjkuzrtzkzsk
          supabase functions deploy vestora-public-order --project-ref vqinmequtjkuzrtzkzsk
          supabase functions deploy vestora-delivery --project-ref vqinmequtjkuzrtzkzsk
          supabase functions deploy qz-sign --project-ref vqinmequtjkuzrtzkzsk
